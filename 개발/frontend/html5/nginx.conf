# 정적 서빙 + API 프록시. 앱 서버는 클러스터 내부 이름으로만 접근한다.
server {
  listen 8080;
  server_name _;

  # 컨테이너를 비루트로 돌리기 위해 쓰기 경로를 /tmp 로 옮긴다
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  root /usr/share/nginx/html;
  index index.html;

  # 프로브 — 앱 서버에 의존하지 않는다
  # default_type 을 쓴다 — add_header Content-Type 은 기존 헤더에 추가되어 중복 헤더를 만들고,
  # 일부 HTTP 클라이언트(예: PowerShell Invoke-WebRequest)가 응답을 바이너리로 오판하게 한다.
  location = /healthz { default_type application/json; return 200 '{"status":"ok","env":"static"}'; }
  location = /readyz  { default_type application/json; return 200 '{"status":"ready"}'; }

  location /api/ {
    proxy_pass http://${API_UPSTREAM}/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /version {
    proxy_pass http://${API_UPSTREAM}/version;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
