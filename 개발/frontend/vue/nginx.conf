# 정적 서빙 + API 프록시. 앱 서버는 클러스터 내부 이름으로만 접근한다.
server {
  listen 8080;
  server_name _;

  # 컨테이너를 비루트로 돌리기 위해 쓰기 경로를 /tmp 로 옮긴다
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  root /usr/share/nginx/html;
  index index.html;

  # 프로브 — 앱 서버에 의존하지 않는다
  location = /healthz { return 200 '{"status":"ok","env":"static"}'; add_header Content-Type application/json; }
  location = /readyz  { return 200 '{"status":"ready"}';             add_header Content-Type application/json; }

  location /api/ {
    proxy_pass http://${API_UPSTREAM}/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /version {
    proxy_pass http://${API_UPSTREAM}/version;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
