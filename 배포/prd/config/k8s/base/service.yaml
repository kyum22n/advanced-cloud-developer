apiVersion: v1
kind: Service
metadata:
  name: myapp
  namespace: myapp-prd
  annotations:
    # 내부 LB — 외부 노출은 Ingress(관리형 NGINX) 또는 Front Door 가 담당
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector: { app: myapp }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp
  namespace: myapp-prd
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com   # AKS 관리형 NGINX(앱 라우팅 애드온)
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: myapp, port: { number: 80 } } }
