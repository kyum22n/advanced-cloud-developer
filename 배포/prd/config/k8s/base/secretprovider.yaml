# Key Vault 의 비밀을 파드에 마운트하고 K8s Secret 으로도 동기화한다.
# 비밀 '값'은 Git 어디에도 존재하지 않는다 — 참조만 선언한다.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: myapp-kv
  namespace: myapp-prd
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: ea1b62d3-95d2-4924-ae46-fd23044ed0ea
    keyvaultName: kv-myapp-prd-lsrok
    tenantId: 17a943fa-60ce-4fcf-b75f-71c1cee04a80
    objects: |
      array:
        - |
          objectName: github-token
          objectType: secret
        - |
          objectName: notion-token
          objectType: secret
        - |
          objectName: notion-parent-page-id
          objectType: secret
  secretObjects:
    - secretName: myapp-secret
      type: Opaque
      data:
        # myapp이 실제로 쓰는 값만 마운트 — GitHub PAT·Notion 토큰(없어도 앱은 기능 축소 상태로 정상 동작)
        # db-host/db-user/db-password/redis-host는 myapp이 PostgreSQL/Redis를 쓰지 않아 제외함
        # (2026-08-29 최종검토, env.prd.json skipPaasData=true 참고)
        - { objectName: github-token,          key: GITHUB_TOKEN }
        - { objectName: notion-token,          key: NOTION_TOKEN }
        - { objectName: notion-parent-page-id, key: NOTION_PARENT_PAGE_ID }
