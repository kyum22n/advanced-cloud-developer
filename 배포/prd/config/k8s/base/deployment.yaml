apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: myapp-prd
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: myapp }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # 무중단
  template:
    metadata:
      labels:
        app: myapp
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: myapp-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      # 영역·노드에 고르게 분산 — 한 영역이 죽어도 서비스가 살아남는다
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: myapp } }
      containers:
        - name: myapp
          image: myapp:latest        # ← overlay 의 images 패치로 교체
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: myapp-config }
            - secretRef:    { name: myapp-secret }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          volumeMounts:
            - { name: kv, mountPath: /mnt/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: kv
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: myapp-kv }
        - name: tmp
          emptyDir: {}
