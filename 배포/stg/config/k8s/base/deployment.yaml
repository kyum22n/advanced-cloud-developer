apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: myapp-stg
spec:
  replicas: 2
  selector:
    matchLabels: { app: myapp }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: myapp }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: myapp
          image: myapp:latest      # ← Argo CD 가 overlay 의 images 패치로 교체
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: myapp-config }
            - secretRef:    { name: myapp-secret }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: myapp-pdb
  namespace: myapp-stg
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: myapp }
