apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: myapp-dev
  labels: { app: myapp, env: dev }
spec:
  replicas: 1
  selector:
    matchLabels: { app: myapp }
  template:
    metadata:
      labels: { app: myapp, env: dev }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: myapp
          image: myapp:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: myapp-config }
            - secretRef:    { name: myapp-secret }
          # requests 가 없으면 HPA·오토스케일러가 판단 자체를 못 한다 (9차시 심화 참고)
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
          livenessProbe:
            httpGet:  { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:  { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: myapp
  namespace: myapp-dev
spec:
  type: NodePort
  selector: { app: myapp }
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
