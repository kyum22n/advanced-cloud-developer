apiVersion: apps/v1
kind: Deployment
metadata:
  name: repo-insight-mockup
  labels:
    app: repo-insight-mockup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repo-insight-mockup
  template:
    metadata:
      labels:
        app: repo-insight-mockup
    spec:
      containers:
        - name: mockup
          image: repo-insight-mockup:local
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: repo-insight-mockup
spec:
  selector:
    app: repo-insight-mockup
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
