# 정적 서빙 전용 — 상태·DB 불필요(NFR-B-04). API 프록시가 없다.
server {
  listen 8080;
  server_name _;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  root /usr/share/nginx/html;
  index index.html;

  # 프로브 — 의존성이 없으므로 항상 200 (설계/dev/01 §2-2)
  # default_type 을 쓴다 — add_header Content-Type 은 기존 헤더에 추가되어 중복 헤더를 만들고,
  # 일부 HTTP 클라이언트(예: PowerShell Invoke-WebRequest)가 응답을 바이너리로 오판하게 한다.
  location = /healthz { default_type application/json; return 200 '{"status":"ok","env":"static"}'; }
  location = /readyz  { default_type application/json; return 200 '{"status":"ready"}'; }
  # APP-B 는 계약상 /version 이 필수는 아니지만(FR-A-08 은 APP-A 전용), 배포 파이프라인의
  # 버전 검증(80_verify.ps1)과의 호환을 위해 빌드 태그를 노출한다. APP_VERSION 은 배포 시 주입된다.
  location = /version {
    default_type application/json;
    return 200 '{"version":"${APP_VERSION}","env":"static","auth":{"mode":"none","workloadIdentity":false}}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
