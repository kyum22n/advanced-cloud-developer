# 기본 거부 후, 허용된 네임스페이스에서만 인바운드를 받는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: glm-serving
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-glm
  namespace: glm-serving
spec:
  podSelector:
    matchLabels: { app: glm }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: myapp-prd
      ports:
        - protocol: TCP
          port: 8000
