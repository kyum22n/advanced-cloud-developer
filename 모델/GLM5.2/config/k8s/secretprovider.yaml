# Key Vault 의 비밀을 파드에 마운트하고 K8s Secret 으로도 동기화한다.
# 비밀 '값'은 Git 어디에도 존재하지 않는다 — 참조만 선언한다.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: glm-kv
  namespace: glm-serving
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: CLIENT_ID_PLACEHOLDER
    keyvaultName: KEYVAULT_NAME_PLACEHOLDER
    tenantId: TENANT_ID_PLACEHOLDER
    objects: |
      array:
        - |
          objectName: glm-api-key
          objectType: secret
  secretObjects:
    - secretName: glm-secret
      type: Opaque
      data:
        - { objectName: glm-api-key, key: VLLM_API_KEY }
